[breakout.pufferlib]
dataset = /tmp/tkm_breakout_train_full_export_100k_v2/transitions-000000.jsonl
frameskip = 4

[sequence_layout]
kind = obs_action_interleaved
history = 8
predict = action

[tokenizer.observation]
kind = selected_continuous
dims = 16
selection = action_separation
bins = 16

[sequence_model]
kind = linear_policy
epochs = 8
learning_rate = 0.20

[action_head]
kind = categorical
actions = 3
