[breakout.pufferlib]
dataset = /tmp/tkm_breakout_train_full_export_100k_v2/transitions-000000.jsonl
frameskip = 4

[sequence_layout]
kind = obs_action_interleaved
history = 8
predict = action

[tokenizer.observation]
kind = selected_continuous
dims = 16
selection = first_dims
bins = 16

[tokenizer.action]
kind = categorical
actions = 3

[input_features]
kind = value_window

[sequence_model]
kind = mlp_window
hidden = 64
epochs = 80
learning_rate = 0.01

[action_head]
kind = categorical
actions = 3

[render]
token_visualization = continuous_mlp
