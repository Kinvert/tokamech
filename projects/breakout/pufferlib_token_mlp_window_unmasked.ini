[breakout.pufferlib]
dataset = /tmp/tkm_breakout_train_full_export_100k_v2/transitions-000000.jsonl
frameskip = 4

[sequence_layout]
kind = autoregressive_obs_action
history = 8
predict = next_token

[tokenizer.observation]
kind = selected_quantized
dims = 8
selection = first_dims
bins = 16

[tokenizer.action]
kind = categorical
actions = 3

[sequence_model]
kind = token_mlp_window
hidden = 64
epochs = 4
learning_rate = 0.01

[action_head]
kind = categorical
actions = 3

[render]
token_visualization = topk
